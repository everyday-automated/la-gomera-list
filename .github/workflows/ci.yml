name: Verify La Gomera
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app code, manifest, and PWA assets
        run: node --test tests/pwa.test.mjs
